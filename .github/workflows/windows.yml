name: Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - run: node --test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m pip install -r requirements-desktop.txt
      - name: Build native C FFT and desktop executable
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SB_VS_PATH=%%i"
          if not defined SB_VS_PATH exit /b 1
          call "%SB_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          "%pythonLocation%\python.exe" tools/build_desktop.py
      - name: Verify native FFT and app server
        run: python desktop.py --self-test
      - name: Verify WebView2 UI
        run: python desktop.py --smoke-ui
      - name: Package and verify portable executable
        run: |
          $expected = (Get-Content VERSION).Trim()
          $actual = (Get-Item 'releases/Spectral Bench/Spectral Bench.exe').VersionInfo.ProductVersion
          if ($actual -ne $expected) { throw "Executable version $actual differs from VERSION $expected" }
          python tools/package_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Spectral-Bench-Windows-x64
          path: |
            releases/Spectral-Bench-Windows-x64.zip
            releases/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14
